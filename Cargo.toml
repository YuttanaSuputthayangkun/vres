[package]
name = "vres"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli"]
# The `vres` binary: argument parsing, .env loading and console output.
cli = ["dep:clap", "dep:dotenvy", "dep:indicatif", "dep:serde_json", "trash"]
# `vres::trash_sources`: move files to the Recycle Bin (Trash on macOS/Linux).
trash = ["dep:trash"]

[[bin]]
name = "vres"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
dotenvy = { version = "0.15.7", optional = true }
indicatif = { version = "0.18.6", optional = true }
regex = "1.13.1"
serde_json = { version = "1.0.154", optional = true }
trash = { version = "5.3.0", optional = true }
